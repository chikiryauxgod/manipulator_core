name: Host build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tests/requirements.txt
      - name: Configure
        run: >-
          cmake -S . -B build/ci
          -DCMAKE_BUILD_TYPE=Debug
          -DPython3_EXECUTABLE="$PWD/.venv/bin/python"
          -DRTOS_LAYER_BUILD_TESTS=ON
          -DK_BUILD_UNIT_TESTS=ON
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test without a board
        run: ctest --test-dir build/ci --output-on-failure -LE hardware
